<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | CareerCompass</title>

<link rel="stylesheet" href="dashboard.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

.profile-container{
display:grid;
grid-template-columns:320px 1fr;
gap:30px;
margin-top:30px;
}

.profile-card,
.info-card{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.profile-card{
text-align:center;
display:flex;
flex-direction:column;
align-items:center;
}

.profile-card img{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
border:5px solid #2563eb;
margin-bottom:20px;
}

.profile-card h2{
margin-bottom:8px;
}

.profile-card p{
color:#666;
margin-bottom:20px;
}

.edit-btn{
display:inline-block;
background:#2563eb;
color:white;
padding:12px 22px;
border-radius:10px;
text-decoration:none;
margin-bottom:20px;
}

.info-card h2{
margin-bottom:25px;
color:#2563eb;
}

.form-group{
margin-bottom:20px;
}

.form-group label{
display:block;
margin-bottom:8px;
font-weight:600;
}

.form-group input,
.form-group select,
.form-group textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
outline:none;
}

.save-btn{
background:#10b981;
color:white;
border:none;
padding:15px;
width:100%;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.profile-card .stats{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:12px;
margin-top:10px;
width:100%;
}

.profile-card .stat{
background:linear-gradient(135deg,#f7f9fc,#eef4ff);
padding:16px 12px;
border-radius:12px;
text-align:center;
border:1px solid #e5ebf5;
display:flex;
flex-direction:column;
justify-content:center;
min-height:100px;
}

.profile-card .stat h2{
color:#2563eb;
margin-bottom:6px;
font-size:22px;
}

.profile-card .stat p{
color:#5b6472;
margin:0;
font-size:13px;
}

@media(max-width:900px){

.profile-container{
grid-template-columns:1fr;
}

.profile-card .stats{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

Career<span>Compass</span>

</div>

<ul>

<li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>

<li><a href="assessment.html"><i class="fas fa-clipboard-list"></i> Assessment</a></li>

<li><a href="recommendations.html"><i class="fas fa-lightbulb"></i> Recommendations</a></li>

<li><a href="roadmap.html"><i class="fas fa-road"></i> Roadmap</a></li>

<li><a href="ai-coach.html"><i class="fas fa-robot"></i> AI Coach</a></li>

<li><a href="coaches.html"><i class="fas fa-user-tie"></i> Coaches</a></li>

<li><a href="analytics.html"><i class="fas fa-chart-line"></i> Analytics</a></li>

<li class="active">

<a href="profile.html">

<i class="fas fa-user"></i>

Profile

</a>

</li>

<li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>

</ul>

</div>

<div class="main">

<header>

<h1>My Profile</h1>

</header>

<div class="profile-container">

<div class="profile-card">

<img src="images/user.png" alt="Profile">

<h2>Jason Jace</h2>

<p>Student</p>

<a href="#" class="edit-btn">

Change Photo

</a>

<div class="stats">

<div class="stat">

<h2>12</h2>

<p>Career Matches</p>

</div>

<div class="stat">

<h2>65%</h2>

<p>Roadmap</p>

</div>

<div class="stat">

<h2>18</h2>

<p>AI Chats</p>

</div>

</div>

</div>

<div class="info-card">

<h2>Personal Information</h2>

<form>

<div class="form-group">

<label>Full Name</label>

<input
type="text"
value="Jason Jace">

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
value="jason@example.com">

</div>

<div class="form-group">

<label>Phone Number</label>

<input
type="tel"
placeholder="+2547XXXXXXXX">

</div>

<div class="form-group">

<label>School</label>

<input
type="text"
placeholder="Your School">

</div>

<div class="form-group">

<label>Current Grade</label>

<select>

<option>Grade 9</option>

<option>Grade 10</option>

<option>Grade 11</option>

<option>Grade 12</option>

</select>

</div>

<div class="form-group">

<label>Career Goal</label>

<textarea placeholder="Describe your dream career..."></textarea>

</div>

<button class="save-btn">

Save Changes

</button>

</form>

</div>

</div>

</div>

</body>

</html>
