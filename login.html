<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerCompass | Login</title>

    <link rel="stylesheet" href="auth.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Left Side -->

    <div class="left-panel">

        <div class="overlay">

            <h1>Welcome Back!</h1>

            <p>

                Continue your career journey with AI-powered guidance,
                assessments, personalized roadmaps and professional coaching.

            </p>

            <img src="images/login-illustration.svg"
                 alt="Career Illustration">

        </div>

    </div>

    <!-- Right Side -->

    <div class="right-panel">

        <div class="login-box">

            <h2>Login</h2>

            <p>Sign in to continue</p>

            <form action="dashboard.html">

                <div class="input-group">

                    <i class="fa fa-envelope"></i>

                    <input
                        type="email"
                        placeholder="Email Address"
                        required>

                </div>

                <div class="input-group">

                    <i class="fa fa-lock"></i>

                    <input
                        type="password"
                        placeholder="Password"
                        required>

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>

            </form>

            <div class="divider">

                <span>OR</span>

            </div>

            <div class="social-login">

                <button class="google">

                    <i class="fab fa-google"></i>

                    Continue with Google

                </button>

                <button class="microsoft">

                    <i class="fab fa-microsoft"></i>

                    Continue with Microsoft

                </button>

            </div>

            <p class="register">

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </p>

        </div>

    </div>

</div>

</body>
</html>
